# ============================================
# ANHA Trading - Production Docker Compose
# With Nginx Reverse Proxy & SSL
# For Hostinger VPS Deployment
# ============================================

services:
  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: anha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-data:/etc/letsencrypt:ro
      - ./nginx/www/certbot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - anha-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Certbot for SSL
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: anha-certbot
    volumes:
      - ./nginx/certbot-data:/etc/letsencrypt
      - ./nginx/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - anha-network

  # ============================================
  # Database Service
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: anha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-anha_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - anha-network
    # Security: Don't expose DB port externally
    # Only accessible within the Docker network

  # ============================================
  # FastAPI Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anha-app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ANHA Trading}
      ENVIRONMENT: production
      BASE_URL: ${BASE_URL:-https://localhost}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anha_user}:${POSTGRES_PASSWORD:-change_this_in_production}@db:5432/${POSTGRES_DB:-anha_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-secure-secret-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES:-30}
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anha-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8742/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Security: Don't expose app port externally
    # Only accessible through Nginx

  # ============================================
  # Redis Cache (Optional but recommended)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: anha-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - anha-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Networks
# ============================================
networks:
  anha-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  postgres-data:
    driver: local
  app-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
