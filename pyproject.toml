[project]
name = "fwz"
version = "0.1.0"
description = "FWZ Energy & Electrical — maintenance booking platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.34.2",
    "SQLAlchemy==2.0.40",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "aiosqlite==0.21.0",
    "bcrypt==4.3.0",
    "passlib==1.7.4",
    "python-jose[cryptography]==3.4.0",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "email-validator==2.2.0",
    "orjson==3.11.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "aiosmtplib==4.0.0",
    "alembic==1.15.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-asyncio==1.0.0",
]
