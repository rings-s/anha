# ============================================
# ANHA Trading - Nginx Server Block
# Production configuration for Hostinger VPS
# ============================================

# ============================================
# HTTP to HTTPS Redirect
# ============================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certbot challenge location (for Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS Server Block
# ============================================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # ============================================
    # SSL Certificate Paths (will be mounted from host)
    # ============================================
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

    # ============================================
    # Root and Index
    # ============================================
    root /var/www/html;
    index index.html index.htm;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/anha-access.log main buffer=16k;
    error_log /var/log/nginx/anha-error.log warn;

    # ============================================
    # Static Files - High Performance
    # ============================================
    location /static/ {
        alias /app/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri $uri/ =404;
        
        # Security: Disable execution of PHP and other scripts
        location ~* \\.(php|php3|php4|php5|phtml|pl|py|jsp|asp|aspx|cgi|sh|bash)$ {
            deny all;
        }
    }

    # ============================================
    # Favicon and Robots
    # ============================================
    location = /favicon.ico {
        alias /app/app/static/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /app/app/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Health Check Endpoint (bypass rate limiting)
    # ============================================
    location /health {
        proxy_pass http://app:8742/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # ============================================
    # API Endpoints - Rate Limited
    # ============================================
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;
        
        proxy_pass http://app:8742/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ============================================
    # Authentication Endpoints - Strict Rate Limit
    # ============================================
    location ~ ^/(auth|login|register|forgot-password|reset-password)/ {
        limit_req zone=login burst=5 nodelay;
        limit_conn addr 5;
        
        proxy_pass http://app:8742;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # Main Application - General Rate Limit
    # ============================================
    location / {
        limit_req zone=general burst=10 nodelay;
        limit_conn addr 15;
        
        proxy_pass http://app:8742;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # Deny Access to Hidden Files
    # ============================================
    location ~ /\\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Deny Access to Sensitive Files
    # ============================================
    location ~* \\.(env|env\\.example|gitignore|gitattributes|lock|md|yml|yaml|log|sql|sqlite|sqlite3|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Deny Access to Version Control
    # ============================================
    location ~* \\.(git|svn|hg|bzr|cvs)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Deny Access to Backup and Config Files
    # ============================================
    location ~* \\.(bak|backup|swp|tmp|temp|old|orig|save|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Deny Access to Common Exploit Paths
    # ============================================
    location ~* /(wp-admin|wp-login|admin|administrator|phpmyadmin|phpMyAdmin|pma|myadmin)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Custom Error Pages
    # ============================================
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 /error.html;
    error_page 500 501 502 503 504 505 506 507 508 510 511 /error.html;
    
    location = /error.html {
        root /var/www/html;
        internal;
    }
}
