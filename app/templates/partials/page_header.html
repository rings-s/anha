{#
Page Header Partial Component
Variables:
- title: Main title
- subtitle: Optional subtitle
- action_text: Optional button text
- action_url: Optional button URL
#}
<div class="page-header glass-card animate-in mb-10">
  <div>
    <h2>{{ title }}</h2>
    {% if subtitle %}
    <p class="page-header-sub">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if action_text and action_url %}
  <a class="btn" href="{{ action_url }}">{{ action_text }}</a>
  {% endif %}
</div>
