{% extends "base.html" %}

{% block content %}
<div class="container flex items-center justify-center" style="min-height: 80vh;">
  <div class="glass animate-in text-center p-16 max-w-[600px] rounded-[var(--radius-lg)] relative overflow-hidden">

    {# Decorative watermark #}
    <div class="absolute top-[-40px] right-[-40px] text-[15rem] font-[950] opacity-[0.025] pointer-events-none leading-none select-none">404</div>

    <div class="text-[7rem] font-[950] leading-none tracking-tighter mb-6"
      style="background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
      404
    </div>

    <h1 class="font-[900] mb-4 tracking-tight text-2xl">{{ t['404_title'] }}</h1>
    <p class="text-[var(--text-muted)] text-lg mb-10 leading-relaxed max-w-[45ch] mx-auto">
      {{ t['404_message'] }}
    </p>

    <div class="flex gap-3 justify-center">
      <a href="/" class="btn px-8 py-3 font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
        </svg>
        {{ t['back_home'] }}
      </a>
      <button onclick="history.back()" class="btn outline px-8 py-3 font-bold">
        {% if lang == 'ar' %}
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
        {% else %}
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
        {% endif %}
        {{ t['back'] }}
      </button>
    </div>

  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.anime) {
      anime({
        targets: '.glass',
        translateY: [20, 0],
        opacity: [0, 1],
        duration: 1000,
        easing: 'easeOutElastic(1, .8)'
      });
    }
  });
</script>
{% endblock %}
