{% extends "base.html" %}

{% block content %}
<section class="container animate-in py-8 md:py-14">
  <div class="glass-card max-w-[900px] mx-auto p-10 md:p-12">
    <h2 class="text-center mb-2 text-[2.2rem] font-[900] tracking-tight">{{ t.nav_book }}</h2>
    <p class="text-center text-[var(--text-muted)] mb-10">{{ t.booking_desc }}</p>

    <form method="post" action="/bookings" data-controller="map" class="flex flex-col gap-6">
      <!-- Service & Name Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="form-group">
          <label>{{ t.service }}</label>
          <select name="service_id" required>
            {% for service in services %}
            <option value="{{ service.id }}">{{ service.name_ar if lang == 'ar' else service.name_en }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>{{ t.full_name }}</label>
          <input type="text" name="contact_name" value="{{ current_user.full_name }}" required
            placeholder="{{ t.full_name_placeholder }}">
        </div>
      </div>

      <!-- Phone & Address Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="form-group">
          <label>{{ t.phone }}</label>
          <input type="text" name="contact_phone" value="{{ current_user.phone }}" required placeholder="05xxxxxxxx">
        </div>
        <div class="form-group">
          <label>{{ t.address }}</label>
          <input type="text" name="address_text" data-map-target="address" placeholder="{{ t.address_placeholder }}">
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>{{ t.description }}</label>
        <textarea name="description" rows="3" placeholder="{{ t.description_placeholder }}"></textarea>
      </div>

      <!-- Map Picker Partial -->
      {% include "partials/map_picker.html" %}

      <button class="btn w-full mt-6 py-4 text-[1rem]" type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
        </svg>
        {{ t.submit }}
      </button>
    </form>
  </div>
</section>
{% endblock %}
